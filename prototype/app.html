<!DOCTYPE html>
<html lang="en" data-theme="light" data-mode="exam">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-2: #F5F4F0;
    --rail-bg: #EEECE6;
    --border: #E8E6E1;
    --border-strong: #D8D5CE;
    --text: #1A1A1A;
    --muted: #6B6B6B;
    --faint: #9A9A9A;
    --accent: #0F766E;
    --accent-soft: rgba(15, 118, 110, 0.09);
    --accent-hover: #0D655E;
    --error: #DC2626;
    --error-soft: rgba(220, 38, 38, 0.08);
    --warn: #D97706;
    --warn-soft: rgba(217, 119, 6, 0.08);
    --good: #059669;
    --good-soft: rgba(5, 150, 105, 0.08);
    --glow-red: 255, 77, 77;
    --glow-yellow: 255, 193, 7;
    --glow-green: 5, 150, 105;
  }
  [data-theme="dark"] {
    --bg: #0E0E10;
    --surface: #18181B;
    --surface-2: #1F1F23;
    --rail-bg: #0A0A0C;
    --border: #26262A;
    --border-strong: #3A3A40;
    --text: #EDEDED;
    --muted: #8A8A8A;
    --faint: #5A5A5A;
    --accent: #14B8A6;
    --accent-soft: rgba(20, 184, 166, 0.11);
    --accent-hover: #2DD4BF;
    --error: #F87171;
    --error-soft: rgba(248, 113, 113, 0.10);
    --warn: #FBBF24;
    --warn-soft: rgba(251, 191, 36, 0.10);
    --good: #34D399;
    --good-soft: rgba(52, 211, 153, 0.10);
    --glow-red: 248, 113, 113;
    --glow-yellow: 251, 191, 36;
    --glow-green: 52, 211, 153;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Source Serif 4', Georgia, serif; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

  /* ---------- Layout ---------- */
  .app {
    display: grid;
    grid-template-columns: 60px 1fr 360px;
    height: 100vh;
  }
  .app.full { grid-template-columns: 60px 1fr 0; }

  /* ---------- Rail ---------- */
  .rail {
    background: var(--rail-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    gap: 4px;
    overflow: hidden;
  }
  .logo {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    display: grid; place-items: center;
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    margin-bottom: 14px;
    user-select: none;
    flex-shrink: 0;
  }
  .rail-btn {
    width: 38px; height: 38px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
    position: relative;
    flex-shrink: 0;
  }
  .rail-btn:hover { background: var(--surface-2); color: var(--text); }
  .rail-btn.active { background: var(--accent-soft); color: var(--accent); }
  .rail-btn svg { width: 19px; height: 19px; stroke-width: 1.75; }
  .rail-spacer { flex: 1; }
  .rail-btn[data-tip]:hover::after {
    content: attr(data-tip);
    position: absolute;
    left: 48px;
    background: var(--text);
    color: var(--bg);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 100;
    pointer-events: none;
  }

  /* ---------- Stage ---------- */
  .stage {
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    min-width: 0;
  }
  .stage.session-mode { overflow: hidden; }
  .stage-inner {
    max-width: 760px;
    margin: 0 auto;
    width: 100%;
    padding: 32px 48px 32px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  .stage-wide { max-width: 960px; }

  /* ---------- Session chat layout ---------- */
  .stage-inner.session-layout {
    height: 100%;
    max-width: 800px;
    padding: 0;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .session-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 22px 48px 14px;
    border-bottom: 1px solid var(--border);
    min-height: 26px;
    flex-shrink: 0;
  }
  .head-line {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
    flex: 1;
    overflow: hidden;
  }
  .head-line h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 0 1 auto;
    min-width: 0;
  }
  .head-line h1.draft { color: var(--muted); }
  .head-meta {
    display: inline-flex;
    align-items: baseline;
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-variant-numeric: tabular-nums;
    flex: 0 1 auto;
    min-width: 0;
    line-height: 1.2;
  }
  .head-meta .sep { color: var(--faint); margin: 0 6px; opacity: 0.5; }
  .head-actions {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-shrink: 0;
  }

  /* Mode switch */
  .mode-switch {
    display: inline-flex;
    background: var(--surface-2);
    border-radius: 7px;
    padding: 2px;
    gap: 1px;
    height: 26px;
    align-items: center;
  }
  .mode-btn {
    font-family: inherit;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 0 10px;
    height: 22px;
    border: none;
    background: transparent;
    color: var(--muted);
    border-radius: 5px;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    background: var(--surface);
    box-shadow: 0 1px 2px rgba(0,0,0,0.06);
  }
  .mode-btn.active[data-mode="exam"] { color: var(--error); }
  .mode-btn.active[data-mode="casual"] { color: var(--accent); }

  /* Messages */
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 22px 48px 20px;
  }

  .chat-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 13.5px;
    text-align: center;
    padding: 40px 0;
  }

  .attempt-block {
    padding: 18px 16px;
    margin: 0 -16px;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .attempt-block:hover { background: var(--surface-2); }
  .attempt-block.active { background: var(--accent-soft); }

  .attempt-head {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--muted);
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .attempt-index {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .attempt-topic-mini {
    font-family: 'Source Serif 4', serif;
    font-size: 12.5px;
    color: var(--text);
    font-weight: 500;
  }
  .attempt-meta-sep { color: var(--faint); opacity: 0.5; }
  .attempt-badges-inline {
    display: inline-flex;
    gap: 4px;
    margin-left: 2px;
  }
  .attempt-badges-inline .badge {
    font-size: 10px;
    padding: 0px 5px;
    line-height: 15px;
  }

  /* Transcript marks */
  .transcript {
    font-family: 'Source Serif 4', serif;
    font-size: 19px;
    line-height: 1.65;
    color: var(--text);
  }
  .transcript .corr,
  .transcript .register-mark,
  .transcript .style-mark {
    cursor: pointer;
    padding: 1px 2px;
    border-radius: 3px;
    transition: background 0.15s;
    white-space: nowrap;
  }

  .transcript .corr:hover { background: var(--surface-2); }
  .transcript .corr.active { background: var(--accent-soft); }
  .transcript del {
    color: var(--error);
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    opacity: 0.75;
  }
  .transcript ins {
    color: var(--text);
    text-decoration: none;
    font-weight: 600;
    background: var(--good-soft);
    padding: 0 3px;
    border-radius: 3px;
  }

  .transcript .register-mark {
    color: var(--warn);
    border-bottom: 1.5px dashed var(--warn);
  }
  .transcript .register-mark:hover { background: var(--warn-soft); }
  .transcript .register-mark.active { background: var(--warn-soft); }

  .transcript .style-mark {
    color: var(--good);
    border-bottom: 1.5px dashed var(--good);
  }
  .transcript .style-mark:hover { background: var(--good-soft); }
  .transcript .style-mark.active { background: var(--good-soft); }

  [data-mode="exam"] .transcript .style-mark {
    color: inherit;
    border-bottom: none;
    cursor: default;
    pointer-events: none;
  }

  .attempt-actions {
    display: flex;
    gap: 6px;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  /* Composer */
  .chat-composer {
    flex-shrink: 0;
    padding: 18px 48px 28px;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }
  .composer-topic-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 6px;
  }
  .composer-topic-text {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    line-height: 1.3;
    font-weight: 500;
    letter-spacing: -0.005em;
    margin-bottom: 14px;
    color: var(--text);
    max-width: 55ch;
  }
  .composer-actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .composer-recording {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 4px 0;
  }
  .composer-recording .waveform { height: 56px; max-width: 380px; }
  .composer-transcribing {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 20px 0;
    color: var(--muted);
    font-size: 13px;
  }

  /* ---------- Shared buttons ---------- */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px 10px 15px;
    border-radius: 9px;
    background: var(--accent);
    color: white;
    border: none;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, transform 0.08s;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:active { transform: scale(0.98); }
  .btn-primary .dot { width: 7px; height: 7px; border-radius: 50%; background: white; }
  .btn-primary svg { width: 14px; height: 14px; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 13px;
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border-strong);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .btn-secondary:hover { background: var(--surface-2); }
  .btn-secondary svg { width: 13px; height: 13px; }
  .btn-icon {
    width: 30px; height: 30px;
    border-radius: 7px;
    background: transparent;
    border: 1px solid transparent;
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  .btn-icon:hover { background: var(--surface-2); color: var(--text); }
  .btn-icon svg { width: 15px; height: 15px; }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    border: none;
    padding: 6px 10px 6px 4px;
    margin-left: -4px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.15s, color 0.15s;
    margin-bottom: 20px;
  }
  .back-link:hover { background: var(--surface-2); color: var(--text); }
  .back-link svg { width: 14px; height: 14px; }

  /* Waveform */
  .waveform {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    width: 100%;
  }
  .waveform .bar {
    width: 3px;
    border-radius: 2px;
    background: var(--accent);
    height: 8px;
    opacity: 0.85;
  }
  .waveform.animating .bar { animation: wave 1.1s ease-in-out infinite; }
  @keyframes wave {
    0%, 100% { height: 8px; opacity: 0.55; }
    50% { height: var(--h, 48px); opacity: 1; }
  }
  .rec-timer {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .rec-timer .cur { color: var(--text); font-weight: 500; }
  .btn-stop {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 10px 18px 10px 15px;
    border-radius: 9px;
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border-strong);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-stop:hover { background: var(--surface-2); }
  .btn-stop .sq { width: 9px; height: 9px; border-radius: 2px; background: var(--error); }

  .spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- Page views ---------- */
  .page-title {
    font-family: 'Source Serif 4', serif;
    font-size: 28px;
    font-weight: 500;
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .page-sub { color: var(--muted); font-size: 13.5px; margin-bottom: 32px; }

  /* History head + search */
  .history-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 6px;
  }
  .history-head-left { min-width: 0; }
  .history-head .page-title { margin-bottom: 2px; }
  .history-head .page-sub { margin-bottom: 0; }

  .search-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-shrink: 0;
    padding-top: 4px;
  }
  .search-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    width: 250px;
    height: 32px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 7px;
    padding: 0 8px 0 10px;
    transition: border-color 0.15s;
  }
  .search-input-wrap:focus-within { border-color: var(--accent); }
  .search-input-wrap .search-icon {
    width: 14px; height: 14px;
    color: var(--faint);
    flex-shrink: 0;
    margin-right: 8px;
  }
  .search-input-wrap input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
  }
  .search-input-wrap input::placeholder { color: var(--faint); }
  .search-clear {
    background: transparent;
    border: none;
    padding: 2px;
    color: var(--faint);
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .search-input-wrap.has-value .search-clear { display: flex; }
  .search-clear:hover { color: var(--text); }
  .search-clear svg { width: 13px; height: 13px; }

  .search-adv-toggle {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--muted);
    display: grid; place-items: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
    flex-shrink: 0;
  }
  .search-adv-toggle:hover { background: var(--surface-2); color: var(--text); }
  .search-adv-toggle.open {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
  }
  .search-adv-toggle svg { width: 14px; height: 14px; }

  .search-advanced {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 0 2px;
    flex-wrap: wrap;
  }
  .search-advanced[hidden] { display: none; }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 28px;
    padding: 0 10px;
    border-radius: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .chip:hover { border-color: var(--border-strong); color: var(--text); }
  .chip.on {
    background: var(--accent-soft);
    border-color: transparent;
    color: var(--accent);
  }
  .chip input {
    width: 12px; height: 12px;
    accent-color: var(--accent);
    cursor: pointer;
    margin: 0;
  }

  .search-status {
    font-size: 12px;
    color: var(--muted);
    padding: 8px 0 12px;
    font-variant-numeric: tabular-nums;
  }
  .search-status:empty { display: none; }
  .search-status .err-msg { color: var(--error); }

  .history-group-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 20px 0 8px;
    user-select: none;
  }
  .history-group-label:first-child { margin-top: 0; }

  .history-row {
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 24px;
    align-items: center;
    padding: 12px 14px;
    margin: 0 -14px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.12s;
    border-bottom: 1px solid var(--border);
  }
  .history-row:last-child { border-bottom: none; }
  .history-row:hover { background: var(--surface-2); }

  .history-main { min-width: 0; }
  .history-title {
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .history-meta {
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .history-meta .sep { color: var(--faint); opacity: 0.5; margin: 0 6px; }
  .history-meta .err { color: var(--error); }
  .history-meta .err.low { color: var(--good); }
  .history-meta .err.mid { color: var(--warn); }

  .history-snippet {
    font-family: 'Source Serif 4', serif;
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 100%;
    line-height: 1.4;
  }
  .history-snippet mark {
    background: var(--accent-soft);
    color: var(--accent);
    padding: 0 2px;
    border-radius: 2px;
    font-weight: 500;
  }

  .history-badges { display: flex; gap: 5px; flex-shrink: 0; }

  .empty-results { text-align: center; padding: 60px 20px; }
  .empty-results-title {
    font-family: 'Source Serif 4', serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .empty-results-sub { font-size: 13px; color: var(--muted); }

  /* Insights */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 32px;
  }
  .stat-card {
    padding: 14px 16px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
  }
  .stat-card .k {

function timeAgo(date) {
  const s = Math.floor((Date.now() - date) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}
function fmtTime(date) {
  return date.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function fmtDate(date) {
  return date.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function fmtDuration(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function smartDate(date) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diff = Math.round((today - d) / (1000 * 60 * 60 * 24));
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  if (diff < 7) return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][date.getDay()];
  return fmtDate(date);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pickTopic() {
  return TOPICS[Math.floor(Math.random() * TOPICS.length)];
}
function htmlToText(html) {
  return html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
}
function isInputFocused() {
  const el = document.activeElement;
  return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
}
function attemptTs(att) { return att.startedAt.getTime(); }
function attemptIndex(session, attempt) {
  const sorted = [...session.attempts].sort((a, b) => attemptTs(a) - attemptTs(b));
  return sorted.findIndex(a => attemptTs(a) === attemptTs(attempt)) + 1;
}
function highlightCorrection(html, corrId) {
  return html
    .replace(`class="corr" data-id="${corrId}"`, `class="corr active" data-id="${corrId}"`)
    .replace(`class="register-mark" data-id="${corrId}"`, `class="register-mark active" data-id="${corrId}"`)
    .replace(`class="style-mark" data-id="${corrId}"`, `class="style-mark active" data-id="${corrId}"`);
}
function catDisplayName(cat) {
  return { grammar: 'Grammar', register: 'Register', filler: 'Filler word', style: 'Style' }[cat] || cat;
}
function examBadgeText(status) {
  return {
    'strictly-avoid': 'Strictly avoid for exam',
    'avoid': 'Avoid for exam',
    'use-sparingly': 'Use sparingly',
    'allowed': 'Allowed',
  }[status] || 'Note';
}

// ============================================================
// STATS
// ============================================================
function sessionStats(session) {
  const attempts = session.attempts;
  const totalTime = attempts.reduce((a, x) => a + x.duration, 0);
  const totalWords = attempts.reduce((a, x) => a + x.wordCount, 0);
  const errors = attempts.reduce((a, x) => a + x.corrections.filter(c => c.severity === 'error').length, 0);
  const warnings = attempts.reduce((a, x) => a + x.corrections.filter(c => c.severity === 'warning').length, 0);
  const suggestions = attempts.reduce((a, x) => a + x.corrections.filter(c => c.severity === 'suggestion').length, 0);
  const grammar = attempts.reduce((a, x) => a + x.corrections.filter(c => c.cat === 'grammar').length, 0);
  const register = attempts.reduce((a, x) => a + x.corrections.filter(c => c.cat === 'register').length, 0);
  const filler = attempts.reduce((a, x) => a + x.corrections.filter(c => c.cat === 'filler').length, 0);
  const style = attempts.reduce((a, x) => a + x.corrections.filter(c => c.cat === 'style').length, 0);
  const errRate = totalWords > 0 ? (errors / totalWords) * 100 : 0;
  return { totalTime, totalWords, errors, warnings, suggestions, grammar, register, filler, style, errRate, attemptCount: attempts.length };
}
function errClass(rate) {
  if (rate < 3) return 'low';
  if (rate < 8) return 'mid';
  return '';
}

// Recurring patterns across all sessions (excludes style-only suggestions)
function computeRecurringErrors() {
  const map = new Map();
  for (const session of state.sessions) {
    for (const att of session.attempts) {
      for (const c of att.corrections) {
        if (c.cat === 'style') continue;
        const key = c.cat + '|' + c.label;
        if (!map.has(key)) {
          map.set(key, { key, label: c.label, cat: c.cat, severity: c.severity, count: 0, occurrences: [] });
        }
        const e = map.get(key);
        e.count++;
        e.occurrences.push({ session, attempt: att, correction: c });
      }
    }
  }
  return [...map.values()].sort((a, b) => b.count - a.count || a.label.localeCompare(b.label));
}

function attachHistoryHandlers() {
  const input = document.getElementById('searchInput');
  const wrap = document.getElementById('searchWrap');
  const clearBtn = document.getElementById('searchClear');
  const advToggle = document.getElementById('searchAdvToggle');
  const advPanel = document.getElementById('searchAdvanced');
  const regexChip = document.getElementById('optRegex');
  const caseChip = document.getElementById('optCase');

  input.addEventListener('input', () => {
    state.historySearch.query = input.value;
    wrap.classList.toggle('has-value', input.value.length > 0);
    updateHistoryResults();
  });

  clearBtn.addEventListener('click', () => {
    input.value = '';
    state.historySearch.query = '';
    wrap.classList.remove('has-value');
    updateHistoryResults();
    input.focus();
  });

  advToggle.addEventListener('click', () => {
    state.historySearch.advanced = !state.historySearch.advanced;
    advToggle.classList.toggle('open', state.historySearch.advanced);
    advPanel.hidden = !state.historySearch.advanced;
  });

  regexChip.addEventListener('change', () => {
    state.historySearch.regex = regexChip.checked;
    regexChip.parentElement.classList.toggle('on', regexChip.checked);
    input.placeholder = regexChip.checked ? 'Regex pattern…' : 'Search transcripts…';
    updateHistoryResults();
  });

  caseChip.addEventListener('change', () => {
    state.historySearch.caseSensitive = caseChip.checked;
    caseChip.parentElement.classList.toggle('on', caseChip.checked);
    updateHistoryResults();
  });

  updateHistoryResults();
}

function buildMatcher() {
  const q = state.historySearch.query;
  if (!q) return { find: () => null };

  if (state.historySearch.regex) {
    let re;
    try {
      const flags = state.historySearch.caseSensitive ? 'g' : 'gi';
      re = new RegExp(q, flags);
    } catch (e) {
      return { error: e.message };
    }
    return {
      find: (text) => {
        re.lastIndex = 0;
        const m = re.exec(text);
        if (!m) return null;
        return { index: m.index, matchText: m[0] };
      },
    };
  }

  const needle = state.historySearch.caseSensitive ? q : q.toLowerCase();
  return {
    find: (text) => {
      const hay = state.historySearch.caseSensitive ? text : text.toLowerCase();
      const idx = hay.indexOf(needle);
      if (idx < 0) return null;
      return { index: idx, matchText: text.substr(idx, needle.length) };
    },
  };
}

function buildSnippet(text, match, ctx) {
  ctx = ctx || 50;
  const mLen = match.matchText.length;
  const start = Math.max(0, match.index - ctx);
  const end = Math.min(text.length, match.index + mLen + ctx);
  const pre = (start > 0 ? '…' : '') + text.slice(start, match.index);
  const mid = text.slice(match.index, match.index + mLen);
  const post = text.slice(match.index + mLen, end) + (end < text.length ? '…' : '');
  return `${escapeHtml(pre)}<mark>${escapeHtml(mid)}</mark>${escapeHtml(post)}`;
}

function updateHistoryResults() {
  const resultsEl = document.getElementById('historyResults');
  const statusEl = document.getElementById('searchStatus');
  if (!resultsEl || !statusEl) return;

  const q = state.historySearch.query.trim();
  const hasQuery = q.length > 0;

  let sessionResults = [];
  let error = null;

  if (hasQuery) {
    const matcher = buildMatcher();
    if (matcher.error) {
      error = matcher.error;
    } else {
      for (const s of state.sessions) {
        const matches = [];
        for (const a of s.attempts) {
          const text = htmlToText(a.html);
          const m = matcher.find(text);
          if (m) matches.push({ attempt: a, index: m.index, matchText: m.matchText, fullText: text });
        }
        if (matches.length) sessionResults.push({ session: s, matches });
      }
    }
  } else {
    sessionResults = state.sessions.map(s => ({ session: s, matches: [] }));
  }

  sessionResults.sort((a, b) => b.session.createdAt - a.session.createdAt);

  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  const weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);

  const groups = { Today: [], Yesterday: [], 'This week': [], Older: [] };
  sessionResults.forEach(r => {
    const d = new Date(r.session.createdAt);
    const dDay = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    if (dDay >= today) groups.Today.push(r);
    else if (dDay >= yesterday) groups.Yesterday.push(r);
    else if (dDay >= weekAgo) groups['This week'].push(r);
    else groups.Older.push(r);
  });

  let html = '';

  if (error) {
    html = '';
  } else if (sessionResults.length === 0) {
    if (hasQuery) {
      html = `<div class="empty-results">
        <div class="empty-results-title">No matches</div>
        <div class="empty-results-sub">No session transcript contains your query.</div>
      </div>`;
    } else {
      html = `<div class="empty-results">
        <div class="empty-results-title">No sessions yet</div>
        <div class="empty-results-sub">Start one from the + button.</div>
      </div>`;
    }
  } else {
    for (const [name, list] of Object.entries(groups)) {
      if (!list.length) continue;
      html += `<div class="history-group-label">${name}</div><div>`;
      list.forEach(r => { html += historyRowHtml(r, hasQuery); });
      html += `</div>`;
    }
  }

  resultsEl.innerHTML = html;

  if (error) {
    statusEl.className = 'search-status';
    statusEl.innerHTML = `<span class="err-msg">Invalid regex — ${escapeHtml(error)}</span>`;
  } else if (hasQuery) {
    statusEl.className = 'search-status';
    statusEl.textContent = `${sessionResults.length} of ${state.sessions.length} session${state.sessions.length === 1 ? '' : 's'} match`;
  } else {
    statusEl.className = 'search-status';
    statusEl.textContent = '';
  }

  resultsEl.querySelectorAll('.history-row').forEach(row => {
    row.addEventListener('click', () => openSession(row.dataset.session));
  });
}

function historyRowHtml(r, showSnippet) {
  const s = r.session;
  const st = sessionStats(s);
  const date = new Date(s.createdAt);
  const rateClass = errClass(st.errRate);

  const badges = [];
  if (st.grammar) badges.push(`<span class="badge g">${st.grammar} grammar</span>`);
  if (st.warnings) badges.push(`<span class="badge f">${st.warnings} warning${st.warnings === 1 ? '' : 's'}</span>`);
  if (st.style && state.mode === 'casual') badges.push(`<span class="badge l">${st.style} style</span>`);

  let snippetHtml = '';
  if (showSnippet && r.matches.length) {
    const sorted = [...r.matches].sort((a, b) => b.attempt.startedAt - a.attempt.startedAt);
    const m = sorted[0];
    snippetHtml = `<div class="history-snippet">${buildSnippet(m.fullText, m)}</div>`;
  }

  return `
    <div class="history-row" data-session="${s.id}">
      <div class="history-main">
        <div class="history-title">${escapeHtml(s.title)}</div>
        <div class="history-meta">
          <span>${fmtTime(date)}</span>
          <span class="sep">·</span>
          <span>${st.attemptCount} attempt${st.attemptCount === 1 ? '' : 's'}</span>
          <span class="sep">·</span>
          <span>${fmtDuration(st.totalTime)}</span>
          <span class="sep">·</span>
          <span class="err ${rateClass}">${st.errRate.toFixed(1)}% mistakes</span>
        </div>
        ${snippetHtml}
      </div>
      <div class="history-badges">${badges.join('')}</div>
    </div>`;
}

// ============================================================
// INSIGHTS — two columns by mode
// ============================================================
function renderInsights() {
  const allAttempts = state.sessions.flatMap(s => s.attempts);
  const totalSessions = state.sessions.length;
  const totalTime = allAttempts.reduce((a, x) => a + x.duration, 0);
  const totalWords = allAttempts.reduce((a, x) => a + x.wordCount, 0);
  const totalErr = allAttempts.reduce((a, x) => a + x.corrections.filter(c => c.severity === 'error').length, 0);
  const rate = totalWords > 0 ? (totalErr / totalWords) * 100 : 0;

  const allErrors = computeRecurringErrors();
  // Exam mode flags objective errors + register/filler warnings.
  const examErrors = allErrors;
  // Casual mode only flags objective grammar mistakes.
  const casualErrors = allErrors.filter(e => e.cat === 'grammar');

  const renderErrorRow = (e) => `
    <div class="error-row cat-${e.cat}" data-error-key="${escapeHtml(e.cat + '|' + e.label)}">
      <div>
        <div class="error-row-label">${escapeHtml(e.label)}</div>
        <div class="error-row-sub">${catDisplayName(e.cat)}</div>
      </div>
      <div class="error-row-right">
        <div class="error-row-count">${e.count}</div>
        <div class="error-row-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </div>
    </div>`;

  const renderColumn = (mode, title, sub, list) => {
    const body = list.length === 0
      ? `<div class="error-empty">No patterns yet</div>`
      : `<div class="error-list">${list.slice(0, 8).map(renderErrorRow).join('')}</div>`;
    return `
      <div class="error-column">
        <div class="error-column-head">
          <div class="error-column-title ${mode}">
            <span class="dot-ind"></span>
            ${title}
          </div>
          <div class="error-column-sub">${sub}</div>
        </div>
        ${body}
      </div>`;
  };

  return `
    <div class="stage-inner stage-wide">
      <div class="page-title serif">Insights</div>
      <div class="page-sub">Aggregated across all your sessions.</div>

      <div class="stats-grid">
        <div class="stat-card"><div class="k">Sessions</div><div class="v">${totalSessions}</div></div>
        <div class="stat-card"><div class="k">Speaking time</div><div class="v">${Math.floor(totalTime / 60)}<small>m</small></div></div>
        <div class="stat-card"><div class="k">Words spoken</div><div class="v">${totalWords}</div></div>
        <div class="stat-card"><div class="k">Mistake rate</div><div class="v">${rate.toFixed(1)}<small>%</small></div></div>
      </div>

      <div class="section-label">Sessions over time</div>
      <div style="border:1px solid var(--border); border-radius:10px; padding:24px; background:var(--surface); margin-bottom:28px; color:var(--muted); font-size:13px; text-align:center;">
        Chart placeholder — sessions &amp; mistake rate over the last 30 days
      </div>

      <div class="section-label">
        Top recurring patterns
        <span style="font-size:11px; font-weight:400; text-transform:none; letter-spacing:0; color:var(--muted);">click to see examples</span>
      </div>
      <div class="error-columns">
        ${renderColumn(
          'exam',
          'Exam mode',
          'Formal · DELF / TEF / TCF',
          examErrors
        )}
        ${renderColumn(
          'casual',
          'Casual mode',
          'Conversational · objective only',
          casualErrors
        )}
      </div>
    </div>`;
}

function attachInsightsHandlers() {
  document.querySelectorAll('.error-row').forEach(row => {
    row.addEventListener('click', () => {

// ============================================================
// ERROR DETAIL
// ============================================================
function renderErrorDetail() {
  const { cat, label } = state.errorDetail;
  const errors = computeRecurringErrors();
  const e = errors.find(x => x.cat === cat && x.label === label);

  if (!e) {
    return `
      <div class="stage-inner stage-wide">
        <button class="back-link" id="errorBack">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
          Back to Insights
        </button>
        <div class="page-title serif">Error not found</div>
      </div>`;
  }

  const bySession = new Map();
  for (const occ of e.occurrences) {
    if (!bySession.has(occ.session.id)) bySession.set(occ.session.id, { session: occ.session, occurrences: [] });
    bySession.get(occ.session.id).occurrences.push(occ);
  }
  const groups = [...bySession.values()].sort((a, b) => b.session.createdAt - a.session.createdAt);

  const groupsHtml = groups.map(g => {
    const session = g.session;
    const date = new Date(session.createdAt);
    const occs = [...g.occurrences].sort((a, b) => attemptTs(a.attempt) - attemptTs(b.attempt));

    return `
      <div class="occurrence-group">
        <div class="occurrence-group-head">
          <button class="occurrence-session-title" data-open-session="${session.id}">
            ${escapeHtml(session.title)}
            <span class="occurrence-session-date">${smartDate(date)} · ${fmtTime(date)}</span>
          </button>
          <button class="occurrence-open" data-open-session="${session.id}">
            Open session
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </button>
        </div>
        ${occs.map(occ => {
          const idx = attemptIndex(session, occ.attempt);
          const c = occ.correction;
          const highlightedHtml = highlightCorrection(occ.attempt.html, c.id);
          const oldClass = c.severity === 'error' ? 'old' : 'old warn';
          return `
            <div class="occurrence-card">
              <div class="occurrence-card-head">
                <span class="occurrence-card-index">Attempt ${idx}</span>
                <span class="attempt-meta-sep">·</span>
                <span>${fmtTime(occ.attempt.startedAt)}</span>
                <span class="attempt-meta-sep">·</span>
                <span>${fmtDuration(occ.attempt.duration)}</span>
                <span class="attempt-meta-sep">·</span>
                <span>${escapeHtml(occ.attempt.topicTitle || 'Practice')}</span>
              </div>
              <div class="occurrence-diff serif">
                <span class="${oldClass}">${escapeHtml(c.old)}</span>
                <span class="arrow">→</span>
                <span class="new">${escapeHtml(c.neu)}</span>
              </div>
              <div class="error-example">
                <div class="transcript">${highlightedHtml}</div>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');

  return `
    <div class="stage-inner stage-wide">
      <button class="back-link" id="errorBack">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        Back to Insights
      </button>
      <div class="page-title serif">${escapeHtml(e.label)}</div>
      <div class="error-detail-sub">
        <span class="error-cat-badge ${e.cat}">${catDisplayName(e.cat)}</span>
        <span>${e.count} occurrence${e.count === 1 ? '' : 's'} across ${groups.length} session${groups.length === 1 ? '' : 's'}</span>
      </div>
      ${groupsHtml}
    </div>`;
}

function attachErrorDetailHandlers() {
  const back = document.getElementById('errorBack');
  if (back) back.addEventListener('click', () => { state.view = 'insights'; renderStage(); });
  document.querySelectorAll('[data-open-session]').forEach(el => {
    el.addEventListener('click', (e) => {

    });

}

// ============================================================
// SESSION HANDLERS
// ============================================================
function attachSessionHandlers() {
  const session = getActiveSession();

  const btnRecord = document.getElementById('btnRecord');
  if (btnRecord) btnRecord.addEventListener('click', startRecording);

  const btnNewTopic = document.getElementById('btnNewTopic');
  if (btnNewTopic) btnNewTopic.addEventListener('click', () => {
    state.draftTopic = pickTopic();
    renderStage();
    renderPanel();
  });

  const btnStop = document.getElementById('btnStop');
  if (btnStop) btnStop.addEventListener('click', stopRecording);

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      setMode(btn.dataset.mode);
    });
  });

  const btnRename = document.getElementById('btnRenameSession');
  if (btnRename) btnRename.addEventListener('click', () => {
    if (!session) return;
    const name = prompt('Session title:', session.title);
    if (name && name.trim()) { session.title = name.trim(); renderStage(); }
  });

  const btnDelete = document.getElementById('btnDeleteSession');
  if (btnDelete) btnDelete.addEventListener('click', () => {
    if (!session) return;
    if (confirm("Delete this session? This can't be undone.")) {
      state.sessions = state.sessions.filter(s => s.id !== session.id);
      newDraft();
    }
  });

  document.querySelectorAll('.attempt-block').forEach(block => {
    block.addEventListener('click', (e) => {
      if (e.target.closest('button')) return;
      if (!session) return;
      const ts = Number(block.dataset.attempt);
      const att = session.attempts.find(a => attemptTs(a) === ts);
      if (!att) return;
      state.activeAttempt = att;
      document.querySelectorAll('.attempt-block').forEach(b => b.classList.toggle('active', b === block));
      renderPanel();
    });
  });

  document.querySelectorAll('.transcript .corr, .transcript .register-mark, .transcript .style-mark').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      if (session) {
        const block = el.closest('.attempt-block');
        if (block) {
          const ts = Number(block.dataset.attempt);
          const att = session.attempts.find(a => attemptTs(a) === ts);
          if (att && getActiveAttemptTs() !== ts) {
            state.activeAttempt = att;
            document.querySelectorAll('.attempt-block').forEach(b => b.classList.toggle('active', b === block));
            renderPanel();
          }
        }
      }
      activateCorrection(el.dataset.id);
    });
  });

  const btnPlayCorrected = document.getElementById('btnPlayCorrected');
  if (btnPlayCorrected) {
    btnPlayCorrected.addEventListener('click', (e) => {
      e.stopPropagation();
      const block = btnPlayCorrected.closest('.attempt-block');
      if (!block || !session) return;
      const ts = Number(block.dataset.attempt);
      const att = session.attempts.find(a => attemptTs(a) === ts);
      if (att) speak(htmlToText(att.html));
    });
  }

  const btnShadow = document.getElementById('btnShadow');
  if (btnShadow) {
    btnShadow.addEventListener('click', (e) => {
      e.stopPropagation();
      showToast('Shadow mode — listen, then repeat each sentence');
      const block = btnShadow.closest('.attempt-block');
      if (!block || !session) return;
      const ts = Number(block.dataset.attempt);
      const att = session.attempts.find(a => attemptTs(a) === ts);
      if (att && att.corrections[0]) speak(att.corrections[0].speak);
    });
  }
}

function scrollMessagesToBottom() {
  const el = document.getElementById('chatMessages');
  if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
}

// PANEL
// ============================================================
function renderPanel() {
  const panel = document.getElementById('panel');

  if (state.view !== 'session') { panel.innerHTML = ''; return; }

  const session = getActiveSession();

  if (!session) {
    panel.innerHTML = `
      <div class="panel-section">
        <div class="panel-label">Session stats</div>
      </div>
      <div class="panel-section">
        <div class="panel-label">Setup</div>
        <div class="stat-row"><span class="k">Level</span><span class="v">B1</span></div>
        <div class="stat-row"><span class="k">Exam</span><span class="v">DELF B1</span></div>
        <div class="stat-row"><span class="k">Mode</span><span class="v">${state.mode === 'exam' ? 'Exam' : 'Casual'}</span></div>
      </div>
      <div class="panel-section" style="margin-top:auto;">
        <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--faint);">
          <span>Stored locally</span>
          <span>Ready</span>
        </div>
      </div>`;
    return;
  }

  const st = sessionStats(session);
  let html = '';

  const att = state.activeAttempt;
  if (att) {
    const grammar = att.corrections.filter(c => c.cat === 'grammar');
    const warnings = att.corrections.filter(c => c.severity === 'warning');
    const style = att.corrections.filter(c => c.cat === 'style');

    html += `<div class="panel-section">
      <div class="panel-label">
        Attempt · ${fmtTime(att.startedAt)}
        <span class="count">${fmtDuration(att.duration)}</span>
      </div>
    </div>`;

    if (grammar.length) {
      html += `<div class="panel-section">
        <div class="panel-label">Grammar <span class="count">${grammar.length}</span></div>
        ${grammar.map(c => fbItemHtml(c)).join('')}
      </div>`;
    }
    if (warnings.length) {
      html += `<div class="panel-section">
        <div class="panel-label">Register &amp; fillers <span class="count">${warnings.length}</span></div>
        ${warnings.map(c => fbItemHtml(c)).join('')}
      </div>`;
    }
    if (style.length && state.mode === 'casual') {
      html += `<div class="panel-section">
        <div class="panel-label">Style <span class="count">${style.length}</span></div>
        ${style.map(c => fbItemHtml(c)).join('')}
      </div>`;
    }
    if (!grammar.length && !warnings.length && (!style.length || state.mode === 'exam')) {
      html += `<div class="panel-section">
        <div class="panel-label">Feedback</div>
        <div class="panel-hint">Clean attempt. No corrections.</div>
      </div>`;
    }
  }

  html += `<div class="panel-section">
    <div class="panel-label">Session stats</div>
    <div class="stat-row"><span class="k">Attempts</span><span class="v">${st.attemptCount}</span></div>
    <div class="stat-row"><span class="k">Speaking time</span><span class="v">${fmtDuration(st.totalTime)}</span></div>
    <div class="stat-row"><span class="k">Words spoken</span><span class="v">${st.totalWords}</span></div>
    <div class="stat-row"><span class="k">Mistakes</span><span class="v mistakes">${st.errors}</span></div>
    <div class="stat-row"><span class="k">Warnings</span><span class="v warnings">${st.warnings}</span></div>
    <div class="stat-row"><span class="k">Mistake rate</span><span class="v">${st.errRate.toFixed(1)}%</span></div>
  </div>`;

  if (st.errors + st.warnings + (state.mode === 'casual' ? st.style : 0) > 0) {
    const reds = st.grammar;
    const yellows = st.register + st.filler;
    const greens = state.mode === 'casual' ? st.style : 0;
    const total = reds + yellows + greens;
    html += `<div class="panel-section">
      <div class="panel-label">Breakdown</div>
      <div class="cat-bar">
        ${reds ? `<div class="seg g" style="width:${(reds / total) * 100}%"></div>` : ''}
        ${yellows ? `<div class="seg f" style="width:${(yellows / total) * 100}%"></div>` : ''}
        ${greens ? `<div class="seg l" style="width:${(greens / total) * 100}%"></div>` : ''}
      </div>
      <div class="cat-legend">
        ${reds ? `<div class="item"><span class="sw g"></span>${reds} grammar</div>` : ''}
        ${yellows ? `<div class="item"><span class="sw f"></span>${yellows} warning${yellows === 1 ? '' : 's'}</div>` : ''}
        ${greens ? `<div class="item"><span class="sw l"></span>${greens} style</div>` : ''}
      </div>
    </div>`;
  }

  html += `<div class="panel-section" style="margin-top:auto;">
    <div style="display:flex; justify-content:space-between; font-size:11px; color:var(--faint);">
      <span>Stored locally</span>
      <span>${timeAgo(session.createdAt)}</span>
    </div>
  </div>`;

  panel.innerHTML = html;

  panel.querySelectorAll('.fb-play').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      speak(btn.dataset.speak);
    });
  });

  attachFeedbackLinking();
}

function fbItemHtml(c) {
  const oldClass = c.severity === 'error' ? 'old' : 'old warn';
  const catLabel = catDisplayName(c.cat);

  let examBadge = '';
  if (c.severity === 'warning' && state.mode === 'exam' && c.examStatus) {
    examBadge = `<div class="fb-exam-badge ${c.examStatus}">${examBadgeText(c.examStatus)}</div>`;
  } else if (c.severity === 'warning' && state.mode === 'casual') {
    examBadge = `<div class="fb-exam-badge allowed">Alternative register</div>`;
  }

  return `
    <div class="fb-item" data-fbid="${c.id}">
      <div class="fb-cat ${c.cat}"><span class="dot-s"></span>${catLabel}</div>
      <div class="fb-change serif">
        <span class="${oldClass}">${escapeHtml(c.old)}</span> → <span class="new">${escapeHtml(c.neu)}</span>
      </div>
      <div class="fb-why">${escapeHtml(c.why)}</div>
      ${examBadge}
      <button class="fb-play" data-speak="${escapeHtml(c.speak)}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Hear it
      </button>
    </div>`;
}

function attachFeedbackLinking() {
  document.querySelectorAll('.transcript .corr, .transcript .register-mark, .transcript .style-mark').forEach(el => {
    el.addEventListener('mouseenter', () => activateCorrection(el.dataset.id));
  });
  document.querySelectorAll('.fb-item[data-fbid]').forEach(el => {
    el.addEventListener('mouseenter', () => activateCorrection(el.dataset.fbid));
    el.addEventListener('click', (e) => {
      if (e.target.closest('.fb-play')) return;
      activateCorrection(el.dataset.fbid);
    });
  });
}
function activateCorrection(id) {
  document.querySelectorAll('.transcript .corr, .transcript .register-mark, .transcript .style-mark').forEach(el => {
    el.classList.toggle('active', el.dataset.id === id);
  });
  document.querySelectorAll('.fb-item[data-fbid]').forEach(el => {
    el.classList.toggle('active', el.dataset.fbid === id);
  });
}

            <option${state.mode === 'casual' ? ' selected' : ''}>Casual</option>
          </select>
        </div>
      </div>

      <div class="settings-group">
        <h3>AI Provider (BYOK)</h3>
        <div class="field">
          <div class="label">Provider</div>
          <select><option>Groq</option><option>OpenAI</option><option>Google Gemini</option><option>Custom</option></select>
        </div>
        <div class="field">
          <div class="label">API key<span class="desc">Stored encrypted on this device</span></div>
          <input type="password" value="gsk_••••••••••••••••••••" />
        </div>
      </div>

      <div class="settings-group">
        <h3>Storage &amp; Sync (BYOC)</h3>
        <div class="field">
          <div class="label">Local database<span class="desc">~/Documents/Fluence/practice.db</span></div>
          <button class="btn-secondary">Change</button>
        </div>
        <div class="field">
          <div class="label">Cloud sync</div>
          <select><option>Google Drive</option><option>pCloud</option><option>Filen</option><option>MEGA</option><option>WebDAV</option><option>Off</option></select>

    </div>`;
}
function attachSettingsHandlers() {
  document.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => t.classList.toggle('on'));
  });
  const dm = document.getElementById('defaultMode');
  if (dm) {
    dm.addEventListener('change', () => {
      setMode(dm.value === 'Casual' ? 'casual' : 'exam');
    });
  }
}

// ============================================================
// RECORDING FLOW
// ============================================================
function startRecording() {
  state.elapsed = 0;
  state.phase = 'recording';
  renderStage();
  updateTimer();
  state.timerInterval = setInterval(() => {
    state.elapsed++;
    updateTimer();
    if (state.elapsed >= 60) stopRecording();
  }, 1000);
}
function updateTimer() {
  const el = document.getElementById('timerText');
  if (!el) return;
  const m = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
  const s = String(state.elapsed % 60).padStart(2, '0');
  el.textContent = m + ':' + s;
}
function stopRecording() {
  clearInterval(state.timerInterval);
  state.timerInterval = null;
  state.phase = 'transcribing';
  renderStage();

  const duration = Math.max(1, state.elapsed);

  setTimeout(() => {
    let session = getActiveSession();
    if (!session) {
      const id = 's' + Date.now();
      session = { id, title: state.draftTopic.title, createdAt: new Date(), attempts: [] };
      state.sessions.unshift(session);
      state.activeSessionId = id;
    }

    let tmpl = ATTEMPT_TEMPLATES.find(t => t.topicTitle === state.draftTopic.title);
    if (!tmpl) tmpl = ATTEMPT_TEMPLATES[Math.floor(Math.random() * ATTEMPT_TEMPLATES.length)];

    const attempt = {
      ...clone(tmpl),
      topic: state.draftTopic.prompt,
      topicTitle: state.draftTopic.title,
      startedAt: new Date(),
      duration: Math.min(duration, 90),
      wordCount: tmpl.wordCount,
    };
    session.attempts.push(attempt);

    state.activeAttempt = attempt;
    state.phase = 'idle';

    renderStage();
    renderPanel();
    scrollMessagesToBottom();
  }, 1500);
}

// ============================================================
// NAVIGATION
// ============================================================
function newDraft() {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.activeSessionId = null;
  state.draftTopic = pickTopic();
  state.phase = 'idle';
  state.activeAttempt = null;
  state.view = 'session';

  document.querySelectorAll('.rail-btn[data-view]').forEach(b => b.classList.remove('active'));
  document.getElementById('app').classList.remove('full');
  document.getElementById('panel').style.display = '';

  renderStage();
  renderPanel();
}

function openSession(id) {
  if (state.timerInterval) { clearInterval(state.timerInterval); state.timerInterval = null; }
  state.activeSessionId = id;
  state.phase = 'idle';
  state.view = 'session';

  const s = getActiveSession();
  if (s && s.attempts.length) {
    const sorted = [...s.attempts].sort((a, b) => attemptTs(a) - attemptTs(b));
    state.activeAttempt = sorted[sorted.length - 1];
    const last = sorted[sorted.length - 1];
    const match = TOPICS.find(t => t.title === last.topicTitle);
    state.draftTopic = match || pickTopic();
  } else {
    state.activeAttempt = null;
    state.draftTopic = pickTopic();
  }

  document.querySelectorAll('.rail-btn[data-view]').forEach(b => b.classList.remove('active'));
  document.getElementById('app').classList.remove('full');
  document.getElementById('panel').style.display = '';

  renderStage();
  renderPanel();
  scrollMessagesToBottom();
}

document.querySelectorAll('.rail-btn[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    const view = btn.dataset.view;
    if (state.view === view) return;
    state.view = view;
    state.phase = 'idle';

    document.querySelectorAll('.rail-btn[data-view]').forEach(b => b.classList.toggle('active', b === btn));

    const app = document.getElementById('app');
    if (view === 'history' || view === 'insights' || view === 'settings') {
      app.classList.add('full');
      document.getElementById('panel').style.display = 'none';
    } else {
      app.classList.remove('full');
      document.getElementById('panel').style.display = '';
    }

    renderStage();
    renderPanel();
  });
});

document.getElementById('railNew').addEventListener('click', newDraft);

// ============================================================
// THEME
// ============================================================
const themeToggle = document.getElementById('themeToggle');
const themeIcon = document.getElementById('themeIcon');
const sunPath = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
const moonPath = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
themeToggle.addEventListener('click', () => {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  themeIcon.innerHTML = next === 'light' ? moonPath : sunPath;
});

// ============================================================
// SPEECH
// ============================================================
function speak(text) {
  if (!('speechSynthesis' in window)) { showToast('Speech not available'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'fr-FR';
  u.rate = 0.92;
  const voices = speechSynthesis.getVoices();
  const fr = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
  if (fr) u.voice = fr;
  speechSynthesis.speak(u);
}
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

// ============================================================
// TOAST
// ============================================================
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ============================================================
// KEYBOARD
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && state.phase === 'recording') {
    e.preventDefault();
    stopRecording();
    return;
  }
  if (state.view === 'history' && e.key === '/' && !isInputFocused()) {
    e.preventDefault();
    const input = document.getElementById('searchInput');
    if (input) input.focus();
    return;
  }
  if (e.key === 'Escape' && document.activeElement && document.activeElement.id === 'searchInput') {
    const input = document.getElementById('searchInput');
    if (input.value) {
      input.value = '';
      state.historySearch.query = '';
      document.getElementById('searchWrap').classList.remove('has-value');
      updateHistoryResults();
    } else {
      input.blur();
    }
  }
});

// ============================================================
// INIT
// ============================================================
document.documentElement.setAttribute('data-mode', state.mode);
newDraft();
</script>
