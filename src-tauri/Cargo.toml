[package]
name = "onspot"
version = "0.2.4"
description = "Practise speaking a language and get a teacher's feedback"
authors = ["onspot contributors"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# The app crate plus onspot's own Tauri plugins (one folder each under plugins/).
# Both are members of the repository workspace declared in ../Cargo.toml (P0).

[lib]
name = "onspot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dev-dependencies]
# The OAuth loopback test drives the listener over a real TCP connection.
tokio = { version = "1", features = ["macros", "rt"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-http = "2"
tauri-plugin-opener = "2"
tauri-plugin-speech = { path = "plugins/speech" }
# The core's only door: commands marshal to it, events come back over a channel.
onspot-bridge = { path = "../bindings/onspot-bridge", features = ["tauri"] }
# Native SQLite for the core's storage commands (P2). The legacy plugin stays
# registered until P8, so both paths can write the same database file.
onspot-adapter-repo-sql = { path = "../crates/adapters/repo-sql" }
onspot-ports = { path = "../crates/onspot-ports" }
# Loopback OAuth capture in `src/oauth.rs`.
tokio = { version = "1", features = ["net", "io-util", "sync", "time"] }
url = "2"

# The Linux desktop webview, for its microphone permission (src/microphone.rs).
# Same version Tauri's wry already uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"

# Release settings live in the workspace root (../Cargo.toml): Cargo ignores a
# [profile.*] table inside a workspace member.
