[package]
name = "onspot"
version = "0.1.0"
description = "Learn to speak French on the spot — private, offline, desktop-first."
authors = ["onspot contributors"]
license = "AGPL-3.0-or-later"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# The app crate plus onspot's own Tauri plugins (one folder each under plugins/).
[workspace]
members = ["plugins/speech"]

[lib]
name = "onspot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-speech = { path = "plugins/speech" }

# Release builds (desktop and Android). The app's own Rust is thin, so it is
# built for size; whisper.cpp's C++ is compiled by CMake with its own -O3.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
