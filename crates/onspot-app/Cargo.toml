# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "onspot-app"
description = "onspot's use cases: orchestration over the domain and the ports"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
onspot-domain = { path = "../onspot-domain" }
onspot-ports = { path = "../onspot-ports" }
onspot-dsp = { path = "../onspot-dsp" }
# Wire types are generated by ts-rs; it is build-time tooling, allowed here
# because it names no UI framework or runtime (I2 checks the tree).
serde = { version = "1", features = ["derive"] }
ts-rs = "12"
thiserror = "2"
base64 = "0.22"
futures-channel = "0.3"
serde_json = "1"
once_cell = "1"
regex = "1"
async-trait = "0.1"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
onspot-adapter-repo-sql = { path = "../adapters/repo-sql" }
serde_json = "1"
once_cell = "1"
regex = "1"
async-trait = "0.1"
futures = "0.3"
