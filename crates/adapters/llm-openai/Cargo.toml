# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "onspot-adapter-llm-openai"
description = "OpenAI-compatible LLM adapter: JSON repair, evaluation, explanation, pacing, prompts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
once_cell = "1"
onspot-app = { path = "../../onspot-app" }
onspot-domain = { path = "../../onspot-domain" }
onspot-ports = { path = "../../onspot-ports" }
onspot-dsp = { path = "../../onspot-dsp" }
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
# Long takes and texts are sent in parts, together.
futures = "0.3"
# Transport is the driver's, behind the HttpClient port. The golden fixtures
# for jsonRepair live in tests/golden/.
