# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "onspot-adapter-llm-openai"
description = "OpenAI-compatible LLM adapter: JSON repair, evaluation, explanation, pacing, prompts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
once_cell = "1"
onspot-domain = { path = "../../onspot-domain" }
onspot-ports = { path = "../../onspot-ports" }
onspot-dsp = { path = "../../onspot-dsp" }
regex = "1"
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
async-trait = "0.1"
serde_json = "1"
thiserror = "2"
# reqwest on native / host HTTP on wasm arrives in P4, behind the HttpClient
# port. The goal fixtures for jsonRepair live in tests/golden/.

[dev-dependencies]
futures = "0.3"
