[package]
name = "onspot-adapter-native-stt"
description = "whisper.cpp speech-to-text for desktop and Android, over the SttEngine port"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
onspot-ports = { path = "../../onspot-ports" }
tauri-plugin-speech = { path = "../../../src-tauri/plugins/speech" }
async-trait = "0.1"
# Reuses the existing tauri-plugin-speech engine in-process (P3); the browser
# keeps its Transformers.js worker as a permanent host adapter.
