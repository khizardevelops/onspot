name: Language request
description: Ask for a new language, or volunteer to help review one.
title: "[Language]: "
labels: ["language"]
body:
  - type: markdown
    attributes:
      value: |
        A language only ships after a human has listened to its voices and checked its transcripts.
        That quality bar is why onspot ships one language properly rather than ten badly. Requests
        are welcome, but a request is not a promise or a date.

        Read [docs/languages.md](https://github.com/khizardevelops/onspot/blob/main/docs/languages.md)
        before suggesting models or voices.

  - type: input
    id: language
    attributes:
      label: Language and variety
      placeholder: "Spanish (Spain), Portuguese (Brazil), German..."
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why this language?
      description: Who would use it, and what would they practise?
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Your relationship to the language
      options:
        - I am learning it
        - I am a native speaker
        - I am a teacher
        - I am a native speaker and willing to review transcripts or voices
        - Other
    validations:
      required: true

  - type: textarea
    id: models
    attributes:
      label: Suggested speech models or voices
      description: Optional. Include links, licences and evidence that they work in a browser.
    validations:
      required: false

  - type: checkboxes
    id: help
    attributes:
      label: How you can help
      options:
        - label: I can help review transcripts for accuracy.
          required: false
        - label: I can listen to candidate voices and give feedback.
          required: false
        - label: I can help with prompts or example sessions.
          required: false
        - label: I understand that a language is not added on request alone, and that there is no promised date.
          required: true
