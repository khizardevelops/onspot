# Publishes the web app on GitHub Pages (https://<owner>.github.io/<repo>/) on every push to main.
#
# It is the same static SPA as the desktop and Android apps. Cloud processing works with each
# learner's own API keys (kept in their browser only). GitHub Pages cannot send the
# cross-origin isolation headers, so on-device models run single-threaded there.
name: GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The French G2P assets are gitignored and needed for on-device read-back.
      - name: Copy the eSpeak phonemizer into static/
        run: |
          mkdir -p static/piper-wasm
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.{js,wasm,data} static/piper-wasm/

      # A project site lives under /<repo>/; every route and asset is built under it.
      - name: Build the web app
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          VITE_GOOGLE_CLIENT_ID_WEB: ${{ vars.VITE_GOOGLE_CLIENT_ID_WEB }}
        run: bun run build

      # Pages answers unknown paths with 404.html: the SPA shell, so deep links and reloads work.
      - name: Serve every route with the app
        run: cp build/index.html build/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
