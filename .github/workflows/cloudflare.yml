# Deploys the built SPA to Cloudflare Workers static assets with `cf`.
#
# `cf deploy` cannot build SvelteKit yet, so scripts/cf-deploy.sh assembles the
# Build Output Specification and runs `cf deploy --prebuilt`. The Worker serves
# the app at its root and uses Cloudflare's single-page-application fallback.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   an API token with Workers Scripts: Edit
#   CLOUDFLARE_ACCOUNT_ID  the account id shown in the Cloudflare dashboard
# and the VITE_GOOGLE_CLIENT_ID_WEB variable. Add the Worker origin to the
# Google OAuth web client's authorised JavaScript origins before relying on
# Google Drive sync there.
#
# Until the secrets exist the workflow installs and warns instead of failing.
name: Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install the Cloudflare CLI
        run: bun add -g cf@1.0.0-beta.28

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # The deployed web app defaults to the core backend, so the wasm package
      # must exist before Vite copies static/. The CLI version follows Cargo.lock.
      - name: Cache wasm-bindgen CLI
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install the matching wasm-bindgen CLI
        run: |
          if command -v wasm-bindgen >/dev/null 2>&1; then exit 0; fi
          VERSION="$(awk '/^name = "wasm-bindgen"$/{found=1; next} found && /^version = /{gsub(/[version = \"]/, ""); print; exit}' Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked

      - name: Build the core bridge
        run: bun run bridge:wasm

      # The French G2P assets are gitignored and needed for on-device read-back.
      - name: Copy the eSpeak phonemizer into static/
        run: |
          mkdir -p static/piper-wasm
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.{js,wasm,data} static/piper-wasm/

      # The sherpa-onnx voice runtime (Supertonic) is gitignored too; the script pins and verifies it.
      - name: Fetch the sherpa-onnx voice runtime into static/
        shell: bash
        run: scripts/sherpa-tts-assets.sh

      - name: Explain missing Cloudflare credentials
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::warning::Cloudflare is not deployed from CI yet. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."

      - name: Deploy with cf
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        env:
          VITE_GOOGLE_CLIENT_ID_WEB: ${{ vars.VITE_GOOGLE_CLIENT_ID_WEB }}
        run: scripts/cf-deploy.sh
