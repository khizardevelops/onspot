# Builds the desktop bundles for x64 and ARM: Windows (.exe/.msi; ARM: .exe),
# macOS (.dmg for Apple Silicon and Intel) and Linux (.deb/.AppImage/.rpm, and
# an x64 .flatpak made from the .deb). Push a v* tag to publish them on a
# GitHub Release, or run the workflow manually from the Actions tab.
name: Desktop release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: SPDX headers
        run: bun run spdx:check

  bundle:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          # Windows on ARM is cross-built on x64: Bun has no Windows ARM build.
          # Tauri documents only the NSIS installer for ARM64.
          - name: windows-arm
            os: windows-latest
            target: aarch64-pc-windows-msvc
            args: --target aarch64-pc-windows-msvc --bundles nsis
          - name: macos
            os: macos-latest
          - name: macos-intel
            os: macos-15-intel
          - name: linux
            os: ubuntu-22.04
          - name: linux-arm
            os: ubuntu-22.04-arm

    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # A portable baseline for whisper.cpp's ggml (passed through by whisper-rs):
      # without it ggml is tuned to the build machine's CPU and can crash on others.
      GGML_NATIVE: 'OFF'
      # Public OAuth client ids (repository variables, not secrets). Without
      # them the build still works but Google Drive stays unconfigured.
      VITE_GOOGLE_CLIENT_ID_DESKTOP: ${{ vars.VITE_GOOGLE_CLIENT_ID_DESKTOP }}
      VITE_GOOGLE_CLIENT_ID_WEB: ${{ vars.VITE_GOOGLE_CLIENT_ID_WEB }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The French G2P assets are gitignored and needed by the web build.
      - name: Copy the eSpeak phonemizer into static/
        shell: bash
        run: |
          mkdir -p static/piper-wasm
          cp node_modules/@diffusionstudio/piper-wasm/build/piper_phonemize.{js,wasm,data} static/piper-wasm/

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: desktop-${{ matrix.name }}

      # ggml (whisper.cpp) refuses MSVC for ARM ("use clang"); whisper-rs passes
      # CMAKE_* variables to its CMake build, so it gets Visual Studio's clang-cl.
      - name: Use clang for whisper.cpp on Windows ARM
        if: matrix.name == 'windows-arm'
        shell: bash
        run: echo "CMAKE_GENERATOR_TOOLSET=ClangCL" >> "$GITHUB_ENV"

      # The AppImage bundles every GStreamer plugin installed here
      # (bundle.linux.appimage.bundleMediaFramework); WebKitGTK plays, decodes
      # and captures audio through them. Base and good cover onspot's formats.
      # Not bad: it pulls in a libreadline that breaks the host's /bin/sh when
      # the app opens a link.
      - name: Install Linux system libraries
        if: startsWith(matrix.name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good

      # Tauri runs `beforeBuildCommand` (bun run build) itself.
      - name: Build the desktop bundle
        run: bunx tauri build ${{ matrix.args }}

      # A bundled library that shadows the host's copy only breaks on distros
      # newer than this runner: in 0.1.0 the bundled libwayland-client made
      # WebKit abort on Arch's Mesa. Start the AppImage here (Ubuntu 22.04, the
      # oldest base it supports) and on rolling Arch before publishing it.
      - name: Check the AppImage
        if: startsWith(matrix.name, 'linux')
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appimage="$(echo src-tauri/target/release/bundle/appimage/*.AppImage)"
          packaging/appimage/check.sh "$appimage"
          packaging/smoke-test.sh "$appimage"

      # Arch publishes no ARM64 image, so only the x64 AppImage is started there.
      - name: Start the AppImage on rolling Arch
        if: matrix.name == 'linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          appimage="$(echo src-tauri/target/release/bundle/appimage/*.AppImage)"
          docker run --rm --env APPIMAGE_EXTRACT_AND_RUN --volume "$PWD:/work:ro" --workdir /work archlinux:latest \
            bash -c "pacman -Syu --noconfirm --needed mesa libglvnd wayland libx11 libxcb fontconfig freetype2 harfbuzz fribidi ttf-dejavu xorg-server-xvfb xorg-xauth > /dev/null && packaging/smoke-test.sh '$appimage'"

      # A cross build (--target) writes its bundles under target/<triple>/release.
      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          find src-tauri/target -path '*/release/bundle/*' -type f \
            \( -name '*.exe' -o -name '*.msi' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) \
            -exec cp {} dist/ \;
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: onspot-desktop-${{ matrix.name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: error

      - name: Publish to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  # Repackages the Linux job's .deb as a Flatpak on the GNOME runtime
  # (packaging/flatpak/app.onspot.desktop.yml).
  flatpak:
    needs: bundle
    # Only the Linux bundle is needed, so a failed Windows or macOS bundle does
    # not stop it; without the Linux .deb the download step fails.
    if: ${{ !cancelled() && needs.bundle.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      # flatpak-builder sandboxes each build step with bubblewrap.
      options: --privileged

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: onspot-desktop-linux
          path: linux-bundles

      - name: Stage the .deb for the manifest
        id: stage
        shell: bash
        run: |
          shopt -s nullglob
          debs=(linux-bundles/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one .deb from the Linux job, found ${#debs[@]}." >&2
            exit 1
          fi

          cp "${debs[0]}" packaging/flatpak/onspot.deb
          version="$(basename "${debs[0]}" | cut -d_ -f2)"
          echo "bundle=onspot_${version}_x86_64.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/app.onspot.desktop.yml
          bundle: ${{ steps.stage.outputs.bundle }}

      - name: Publish to a GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.stage.outputs.bundle }}
