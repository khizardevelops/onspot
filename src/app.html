<!doctype html>
<html lang="en" data-theme="light" data-mode="exam">
	<head>
		<meta charset="utf-8" />
		<!-- Deep-link reloads must resolve assets from the app root, not their own path. -->
		<base href="%sveltekit.assets%/" />
		<!-- Browsers keep an icon by its URL: bump ?v= (here and in the manifest) when the icon changes. -->
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/app-icon.svg?v=2" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<meta name="format-detection" content="telephone=no" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/pwa/icons/apple-touch-icon.png?v=2" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="onspot" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="theme-color" media="(prefers-color-scheme: light)" content="#efeae0" />
		<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151412" />
		<script>
			// Before the first paint: pick the remembered theme and the status-bar
			// style it needs. A light page needs dark status-bar text; a dark page
			// needs light text with the content extending underneath.
			(() => {
				try {
					const stored = localStorage.getItem('onspot.theme');
					const dark =
						stored === 'dark' ||
						(stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
					document.documentElement.dataset.theme = dark ? 'dark' : 'light';
					document
						.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
						?.setAttribute('content', dark ? 'black-translucent' : 'default');
				} catch {
					// Storage can be disabled; the default light theme still works.
				}
			})();
		</script>
		<!--
			One launch image per current Apple screen size and orientation. Keep this list in step
			with scripts/pwa-assets.sh; iOS uses only the entry whose media query matches exactly.
		-->
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-pro-max-portrait.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-pro-max-landscape.png" media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-pro-portrait.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-pro-landscape.png" media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-portrait.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-16-landscape.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-14-plus-portrait.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-14-plus-landscape.png" media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/iphone-12-13-14-portrait.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-pro-11-landscape.png" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-air-10-portrait.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-air-10-landscape.png" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-10-portrait.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-10-landscape.png" media="(device-width: 810px) and (device-height: 1080px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-mini-portrait.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
		<link rel="apple-touch-startup-image" href="%sveltekit.assets%/pwa/splash/ipad-mini-landscape.png" media="(device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: landscape)" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
